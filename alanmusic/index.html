<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AlanMusic</title>
<meta name="description" content="AlanMusic — tu música, a tu manera">
<meta name="theme-color" content="#0a0612">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AlanMusic">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..900&family=Plus+Jakarta+Sans:wght@400..800&family=Nunito:wght@400..900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
:root{
  --bg:#07050c; --side:#0c0a12; --card:#14111b; --card2:#1c1824; --hover:#25202e; --line:#262130;
  --text:#f7f5fb; --muted:#a8a3b3; --dim:#6e6879;
  --a1:#ff2e7e; --a2:#ff8a3d; --grad:linear-gradient(135deg,var(--a1),var(--a2));
  --font:'Figtree'; --display:'Bricolage Grotesque';
  --side-w:252px; --panel-w:384px; --top-h:70px; --bar-h:90px; --card-min:176px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font),system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block}
h1,h2,.disp{font-family:var(--display),var(--font),sans-serif}
.i{width:24px;height:24px;fill:currentColor;flex:none}
.i.s{width:20px;height:20px}.i.xs{width:17px;height:17px}.i.l{width:30px;height:30px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#ffffff1c;border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#ffffff33;background-clip:padding-box;border:3px solid transparent}
::selection{background:color-mix(in srgb,var(--a1) 50%,transparent)}
.motion-off *,.motion-off *::before,.motion-off *::after{animation:none!important;transition:none!important}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
#splash .lg{width:110px;height:110px;animation:spl 1.1s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 20px 50px #ff2e7e55)}
#splash .nm{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-1px;margin-top:18px;text-align:center;animation:spl2 1s .25s both}
@keyframes spl{from{transform:scale(.6) rotate(-12deg);opacity:0}}
@keyframes spl2{from{transform:translateY(10px);opacity:0}}

/* ---------- layout ---------- */
.app{display:grid;height:100vh;overflow:hidden;height:100dvh;grid-template-columns:var(--side-w) 1fr var(--panel-w);grid-template-rows:var(--top-h) 1fr var(--bar-h);grid-template-areas:"side top panel" "side main panel" "bar bar bar"}
.side{grid-area:side;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:3px;overflow:hidden;z-index:6}
.top{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 30px;z-index:5;position:relative}
.main{grid-area:main;overflow-y:auto;padding:6px 30px 60px;position:relative;isolation:isolate;scroll-behavior:smooth}
.aurora{position:sticky;top:0;height:0;z-index:-1;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;transition:background .8s}
.aurora i:nth-child(1){width:560px;height:380px;left:-120px;top:-220px;background:var(--a1);animation:au1 18s ease-in-out infinite}
.aurora i:nth-child(2){width:480px;height:340px;left:40%;top:-260px;background:var(--a2);animation:au2 22s ease-in-out infinite;opacity:.2}
.aurora i:nth-child(3){width:420px;height:300px;right:-160px;top:-160px;background:color-mix(in srgb,var(--a1) 40%,#6d4cff);animation:au1 26s ease-in-out infinite reverse;opacity:.18}
.no-amb .aurora{display:none}
@keyframes au1{50%{transform:translate(120px,60px) scale(1.15)}}
@keyframes au2{50%{transform:translate(-140px,40px) scale(.9)}}
.main>.view{animation:vin .4s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
.panel{grid-area:panel;background:var(--side);border-left:1px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column}
.bar{grid-area:bar;background:color-mix(in srgb,var(--side) 86%,transparent);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);border-top:1px solid var(--line);position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:0 22px;gap:20px;z-index:20}
.bar::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--a1),var(--a2),transparent);opacity:.5}
@media (min-width:1181px){.app.nopanel{grid-template-columns:var(--side-w) 1fr;grid-template-areas:"side top" "side main" "bar bar"}.app.nopanel .panel{display:none}}

/* ---------- sidebar ---------- */
.brand{display:flex;align-items:center;gap:11px;padding:4px 12px 20px;font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:-.8px;cursor:pointer}
.brand .lg{width:40px;height:40px;flex:none;filter:drop-shadow(0 8px 18px color-mix(in srgb,var(--a1) 45%,transparent));transition:transform .3s}
.brand:hover .lg{transform:rotate(-8deg) scale(1.05)}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;align-items:center;gap:15px;padding:10px 14px;border-radius:12px;color:var(--muted);font-weight:600;font-size:15px;transition:.15s;width:100%;text-align:left;position:relative}
.nav:hover{background:var(--hover);color:var(--text)}
.nav.on{background:color-mix(in srgb,var(--a1) 13%,var(--side));color:var(--text)}
.nav.on .i{color:var(--a1)}
.nav.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--grad)}
.nav .lb{flex:1}
.sep{height:1px;background:var(--line);margin:10px 6px}
.plhead{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 6px 14px;color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase}
.plhead button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.plhead button:hover{background:var(--hover);color:var(--text)}
.pls{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px;min-height:0}
.pli{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:10px;color:var(--muted);font-weight:500;font-size:14px;text-align:left;width:100%}
.pli:hover{background:var(--hover);color:var(--text)}
.pli.on{color:var(--text);background:var(--hover)}
.pli .pc{width:40px;height:40px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--card2);overflow:hidden}
.pli .pc img{width:100%;height:100%;object-fit:cover}
.pli span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pli small{display:block;color:var(--dim);font-size:12px}
.installb{margin-top:6px}

/* ---------- top ---------- */
.mlogo{display:none;width:34px;height:34px;flex:none}
.search{flex:1;max-width:600px;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--card) 75%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:46px;transition:.15s}
.search:focus-within{border-color:color-mix(in srgb,var(--a1) 60%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 15%,transparent)}
.search .i{color:var(--muted)}
.search input{flex:1;background:none;border:0;outline:0;font-size:15px;min-width:0}
.search input::placeholder{color:var(--dim)}
.search input::-webkit-search-cancel-button{display:none}
.kbd{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-weight:600}
.srcpill{display:flex;background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--line);border-radius:12px;padding:3px}
.srcpill button{padding:7px 13px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.srcpill button.on{background:var(--hover);color:var(--text)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:800;margin-left:auto;cursor:pointer;flex:none;box-shadow:0 6px 18px -6px var(--a1)}

/* ---------- common ---------- */
.hero{position:relative;border-radius:28px;padding:38px 40px 34px;margin:10px 0 8px;overflow:hidden;background:color-mix(in srgb,var(--card) 55%,transparent);border:1px solid #ffffff12;isolation:isolate;display:flex;gap:30px;align-items:center;backdrop-filter:blur(10px)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(80% 140% at 0% 0%,color-mix(in srgb,var(--a1) 40%,transparent),transparent 60%),radial-gradient(70% 120% at 100% 100%,color-mix(in srgb,var(--a2) 35%,transparent),transparent 60%)}
.hero .tx{flex:1;min-width:0}
.hero .hlogo{width:150px;height:150px;flex:none;filter:drop-shadow(0 26px 40px #0008);animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.hero .kick{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:color-mix(in srgb,var(--a1) 55%,#fff)}
.hero h1{font-size:46px;font-weight:800;letter-spacing:-1.8px;line-height:1.02;margin-top:6px}
.hero p{color:var(--muted);margin-top:10px;max-width:640px;line-height:1.55}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 22px;border-radius:999px;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap}
.btn.pri{background:var(--grad);color:#fff;box-shadow:0 10px 26px -12px var(--a1)}
.btn.pri:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.sec{background:#ffffff12;border:1px solid #ffffff14}
.btn.sec:hover{background:#ffffff1f}
.btn.ghost{color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--hover)}
.btn.danger{background:#3a1218;color:#ff6b81;border:1px solid #5a1a25}
.btn.sm{height:36px;padding:0 15px;font-size:13px}
.btn.icon{width:44px;padding:0;justify-content:center}
.sec-h{display:flex;align-items:end;justify-content:space-between;margin:36px 0 14px;gap:12px}
.sec-h h2{font-size:25px;font-weight:800;letter-spacing:-.7px}
.sec-h .sub{color:var(--muted);font-size:13px;margin-bottom:3px;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:999px;background:#ffffff0d;border:1px solid #ffffff12;font-weight:600;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{background:#ffffff1a}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .x{opacity:.5;margin-right:-6px;display:grid}
.chip .x:hover{opacity:1}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -30px;padding:0 30px}
.chips.scroll::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-min),1fr));gap:22px}
.card{cursor:pointer;min-width:0;padding:10px;margin:-10px;border-radius:18px;transition:background .2s}
.card:hover{background:#ffffff09}
.card .art{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--card2);box-shadow:0 16px 34px -20px #000}
.card .art img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card:hover .art img{transform:scale(1.07)}
.card .pbtn{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:50%;background:var(--grad);display:grid;place-items:center;opacity:0;transform:translateY(10px) scale(.9);transition:.22s;z-index:2;box-shadow:0 10px 22px -6px #000;color:#fff}
.card:hover .pbtn,.card.playing .pbtn{opacity:1;transform:none}
.card .t{margin-top:11px;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .a{color:var(--muted);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.round .art{border-radius:50%}
.card.round .t,.card.round .a{text-align:center}
.ph{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 28%,#1a1622),#14111b);color:#ffffff60}
.ph .i{width:40%;height:40%}
.ph.letter{font-size:46px;font-weight:800;color:#fff;background:var(--grad);font-family:var(--display)}
.mosaic{display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%}
.mosaic img{width:100%;height:100%;object-fit:cover}
.mix .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,#000d)}
.mix .lbl{position:absolute;left:14px;bottom:12px;right:60px;z-index:1;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.6px;line-height:1.02;text-shadow:0 2px 12px #000}
.mix .tag{position:absolute;left:12px;top:12px;z-index:1;font-size:10px;font-weight:800;letter-spacing:.8px;padding:4px 8px;border-radius:6px;background:#0008;backdrop-filter:blur(6px);text-transform:uppercase}
.mix .stripe{position:absolute;left:0;right:0;top:0;height:5px;background:var(--grad);z-index:1}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:var(--card-min);gap:22px;overflow-x:auto;padding:10px;margin:-10px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.hscroll>*{scroll-snap-align:start}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:22px}
.qk{display:flex;align-items:center;gap:12px;background:#ffffff0c;border:1px solid #ffffff0d;border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s;height:62px;padding-right:12px;position:relative}
.qk:hover{background:#ffffff18}
.qk .th{width:62px;height:62px;flex:none;background:var(--card2)}
.qk .th img{width:100%;height:100%;object-fit:cover}
.qk .t{font-weight:700;font-size:14px;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.qk .pb{width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center;opacity:0;transition:.2s;color:#fff;flex:none}
.qk:hover .pb,.qk.playing .pb{opacity:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.tile{position:relative;height:118px;border-radius:16px;overflow:hidden;cursor:pointer;padding:16px;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.5px;text-align:left;color:#fff;transition:transform .2s;isolation:isolate}
.tile:hover{transform:translateY(-3px) scale(1.01)}
.tile .em{position:absolute;right:-6px;bottom:-14px;font-size:66px;transform:rotate(18deg);filter:drop-shadow(0 8px 14px #0006);z-index:-1}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff22,transparent 50%);z-index:-1}

/* track list */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:36px 48px minmax(0,1fr) auto 64px;align-items:center;gap:14px;padding:7px 10px;border-radius:12px;cursor:pointer;transition:background .12s;user-select:none;-webkit-user-select:none}
.row:hover{background:#ffffff0b}
.row.cur{background:color-mix(in srgb,var(--a1) 11%,transparent)}
.row .n{color:var(--dim);font-size:14px;text-align:center;font-variant-numeric:tabular-nums;display:grid;place-items:center}
.row .th{width:48px;height:48px;border-radius:9px;overflow:hidden;background:var(--card2);position:relative}
.row .th img{width:100%;height:100%;object-fit:cover}
.row .m{min-width:0}
.row .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur .t{color:color-mix(in srgb,var(--a1) 70%,#fff)}
.row .a{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a .lnk:hover{color:var(--text);text-decoration:underline}
.src{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;padding:1px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}
.src.yt{background:#ff000022;color:#ff6b6b}
.src.lc{background:#3dff9a1c;color:#5de3a0}
.nobadge .src{display:none}
.row .acts{display:flex;gap:2px;align-items:center}
.row .acts .ib.hov{opacity:0}
.row:hover .acts .ib.hov,.row .acts .ib.liked{opacity:1}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:.12s;position:relative;flex:none}
.ib:hover{background:#ffffff14;color:var(--text)}
.ib.liked{color:var(--a1)}
.ib.liked .i{animation:pulse .35s}
@keyframes pulse{50%{transform:scale(1.3)}}
.row .d{color:var(--muted);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.row .n .play-ico{display:none}
.row:hover .n .num{display:none}
.row:hover .n .play-ico{display:grid}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--a1);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.sortable-ghost{opacity:.35}
.sortable-chosen{background:#ffffff14!important}
.drag-h{cursor:grab;color:var(--dim)}

.vhead{display:flex;gap:30px;align-items:flex-end;margin:18px 0 26px;position:relative}
.vhead .cover{width:220px;height:220px;border-radius:22px;overflow:hidden;flex:none;box-shadow:0 30px 70px -26px #000;background:var(--card2);display:grid;place-items:center;position:relative}
.vhead .cover.round{border-radius:50%}
.vhead .cover img{width:100%;height:100%;object-fit:cover}
.vhead .cover>.i{width:42%;height:42%;color:#fff}
.vhead .kind{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.vhead h1{font-size:56px;font-weight:800;letter-spacing:-2.2px;line-height:1;margin:8px 0 10px;word-break:break-word}
.vhead .desc{color:var(--muted);font-size:14px;margin-bottom:8px;max-width:600px;line-height:1.5}
.vhead .meta{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:18px;align-items:center;flex-wrap:wrap}
.tabs .sp{flex:1}
.sel{height:36px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 10px;outline:0;color:var(--text)}
.sel option{background:var(--card)}
.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed #ffffff1f;border-radius:22px}
.empty .i{width:48px;height:48px;color:#ffffff30;margin-bottom:10px}
.empty h3{color:var(--text);font-size:18px;margin-bottom:6px}
.drop{border:2px dashed #ffffff1f;border-radius:22px;padding:26px;text-align:center;color:var(--muted);margin-bottom:22px;transition:.15s}
.drop.over{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 8%,transparent);color:var(--text)}
.drop .row-btns{justify-content:center;margin-top:14px}
.notice{display:flex;gap:12px;align-items:flex-start;background:#2a1a0d;border:1px solid #5a3712;color:#ffcf9c;border-radius:14px;padding:14px 16px;margin:10px 0 18px;font-size:14px;line-height:1.5}
.notice code{background:#0004;padding:1px 6px;border-radius:5px}
.loading{display:flex;gap:10px;align-items:center;color:var(--muted);padding:30px 4px}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid #ffffff22;border-top-color:var(--a1);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#ffffff08,#ffffff12,#ffffff08);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0 6px}
.stat{background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid #ffffff10;border-radius:22px;padding:20px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--grad);opacity:.16;filter:blur(12px)}
.stat .v{font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:-1.4px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.stat .k{color:var(--muted);font-size:13px;font-weight:600;margin-top:4px}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding:16px;background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid #ffffff10;border-radius:22px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart .b{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--grad);min-height:3px;transform-origin:bottom;animation:growy .8s cubic-bezier(.2,.8,.2,1) both}
.chart .b.z{background:#ffffff14}
.chart .l{font-size:11px;color:var(--dim);font-weight:700;white-space:nowrap}
@keyframes growy{from{transform:scaleY(0)}}
.bars{display:flex;flex-direction:column;gap:12px}
.barr{display:grid;grid-template-columns:28px minmax(0,1fr) 76px;gap:12px;align-items:center;cursor:pointer}
.barr .nm{font-weight:700;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barr .tr{height:10px;border-radius:6px;background:#ffffff0d;overflow:hidden}
.barr .fl{height:100%;border-radius:6px;background:var(--grad);transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{transform:scaleX(0)}}
.barr .pos{font-family:var(--display);font-weight:800;font-size:20px;color:var(--dim);text-align:center}
.barr .mn{color:var(--muted);font-size:13px;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* settings */
.set-wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.set-nav{position:sticky;top:6px;display:flex;flex-direction:column;gap:2px}
.set-nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.set-nav a:hover{background:var(--hover);color:var(--text)}
.field{background:color-mix(in srgb,var(--card) 78%,transparent);border:1px solid #ffffff10;border-radius:22px;padding:22px;margin-bottom:16px;scroll-margin-top:10px}
.field>h3{font-size:17px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.field>h3 .i{color:var(--a1)}
.field>p.d{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:6px}
.field ol{padding-left:20px;margin:8px 0;color:var(--muted);font-size:14px;line-height:1.7}
.field a{color:color-mix(in srgb,var(--a1) 65%,#fff)}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 0;border-top:1px solid #ffffff0d}
.opt-row:first-of-type{border-top:0}
.ol{font-weight:650;font-size:15px}
.od{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.45}
.sw{width:46px;height:27px;border-radius:14px;background:#3a3644;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.22s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 6px #0006}
.sw.on{background:var(--grad)}
.sw.on::after{transform:translateX(19px)}
.segc{display:flex;background:#0000004d;border:1px solid var(--line);border-radius:11px;padding:3px;flex-wrap:wrap}
.segc button{padding:7px 13px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.segc button.on{background:var(--grad);color:#fff}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.swt{width:56px;text-align:center;font-size:11px;color:var(--muted);font-weight:600;position:relative}
.swt .c{width:46px;height:46px;border-radius:14px;margin:0 auto 6px;border:2px solid transparent;outline:2px solid transparent;transition:.15s;display:grid;place-items:center;color:#fff}
.swt.on .c{outline-color:#fff;outline-offset:2px}
.swt.on{color:var(--text)}
.swt input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:46px}
.inp{width:100%;height:44px;background:#00000059;border:1px solid #ffffff1a;border-radius:11px;padding:0 14px;outline:0}
textarea.inp{height:auto;padding:10px 14px;resize:vertical;min-height:70px}
.inp:focus{border-color:var(--a1)}
.rng{-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--a1),var(--a2) var(--p,50%),#ffffff1f var(--p,50%));outline:0;width:180px;cursor:pointer}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0007}
.rng::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}
.rv{min-width:44px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;font-weight:700}
.eqbox{display:flex;justify-content:space-around;gap:10px;padding:20px 10px 6px;background:#0000003d;border-radius:16px;margin-top:12px}
.eqb{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:700}
.eqb input{writing-mode:vertical-lr;direction:rtl;width:24px;height:150px;accent-color:var(--a1);cursor:pointer}
.eqb .gv{color:var(--text);font-variant-numeric:tabular-nums}
.disabled{opacity:.45;pointer-events:none}
.kbds{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 18px;margin-top:8px}
.kbds div{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);padding:6px 0;border-bottom:1px solid #ffffff0a}
.kbds kbd{font-family:inherit;font-weight:700;font-size:12px;color:var(--text);background:#ffffff14;border-radius:6px;padding:3px 8px;border-bottom:2px solid #ffffff22}
.about{display:flex;gap:20px;align-items:center}
.about .lg{width:84px;height:84px;flex:none}

/* ---------- now playing panel ---------- */
.amb{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(70px) saturate(1.5);opacity:.42;transition:background-image .8s;pointer-events:none}
.amb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--side) 72%)}
.no-amb .amb,.no-amb .fs-bg{display:none}
.ptop{position:relative;padding:18px 16px 0 22px;display:flex;align-items:center;justify-content:space-between}
.ptop h4{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.slot{position:relative;margin:14px 22px 0;aspect-ratio:1;border-radius:22px;overflow:hidden;background:var(--card);box-shadow:0 30px 60px -26px #000}
.slot img{width:100%;height:100%;object-fit:cover}
.pinfo{position:relative;padding:18px 22px 4px;display:flex;align-items:flex-start;gap:4px}
.pinfo .m{flex:1;min-width:0}
.pinfo .t{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.7px;line-height:1.15}
.pinfo .a{color:var(--muted);margin-top:5px;cursor:pointer}
.pinfo .a:hover{color:var(--text)}
.from{position:relative;padding:0 22px;color:var(--dim);font-size:12px;font-weight:700}
.qhead{position:relative;display:flex;justify-content:space-between;align-items:center;padding:16px 22px 6px}
.qhead h5{font-size:15px;font-weight:800}
.qhead button{color:var(--muted);font-size:13px;font-weight:700}
.qhead button:hover{color:var(--text)}
.queue{position:relative;flex:1;overflow-y:auto;padding:0 12px 16px;min-height:0}
.queue .row{grid-template-columns:40px minmax(0,1fr) 36px;gap:10px;padding:6px 8px}
.queue .row .th{width:40px;height:40px}
.queue .row .acts .ib{opacity:0}
.queue .row:hover .acts .ib{opacity:1}
.pempty{position:relative;flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.pempty .i{width:56px;height:56px;color:#ffffff20}

#ytBox{position:fixed;z-index:75;border-radius:20px;overflow:hidden;background:#000;visibility:hidden;left:-9999px;top:0;width:300px;height:300px}
#ytBox.show{visibility:visible}
#ytBox.float{border-radius:16px;box-shadow:0 20px 50px -10px #000c;border:1px solid #ffffff22;padding-top:24px;background:#111}
#ytGrip{display:none;position:absolute;left:0;right:0;top:0;height:24px;cursor:grab;touch-action:none;align-items:center;justify-content:center;gap:8px;color:#fff9;font-size:11px;font-weight:700}
#ytGrip::before{content:"";width:34px;height:4px;border-radius:2px;background:#fff6}
#ytBox.float #ytGrip{display:flex}
#ytWrap{width:100%;height:100%}
#ytWrap iframe{width:100%;height:100%;border:0;display:block}

/* ---------- player bar ---------- */
.prog{position:absolute;left:0;right:0;top:-7px;height:14px;display:flex;align-items:center;cursor:pointer;z-index:3}
.prog input,.fsprog input{width:100%;-webkit-appearance:none;appearance:none;height:4px;background:linear-gradient(90deg,var(--a1) 0,var(--a2) var(--p,0%),#ffffff26 var(--p,0%));outline:0;cursor:pointer;transition:height .12s;border-radius:4px}
.prog:hover input{height:6px}
.prog input::-webkit-slider-thumb,.fsprog input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;opacity:0;transition:.12s;box-shadow:0 0 0 5px color-mix(in srgb,var(--a1) 30%,transparent)}
.prog:hover input::-webkit-slider-thumb,.fsprog input::-webkit-slider-thumb{opacity:1}
.prog input::-moz-range-thumb,.fsprog input::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
.bl{display:flex;align-items:center;gap:14px;min-width:0}
.bl .th{width:58px;height:58px;border-radius:11px;overflow:hidden;flex:none;background:var(--card2);cursor:pointer;box-shadow:0 8px 20px -10px #000}
.bl .th img{width:100%;height:100%;object-fit:cover}
.bl .m{min-width:0;cursor:pointer;flex:1}
.bl .t{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl .a{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl .mplay{display:none}
.bc{display:flex;align-items:center;gap:8px}
.bc .ib{width:42px;height:42px}
.ib.on{color:var(--a1)}
.ib.on::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--a1)}
.big{width:54px;height:54px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;transition:transform .12s;box-shadow:0 8px 24px -10px #fff6;flex:none}
.big:hover{transform:scale(1.07)}
.big:active{transform:scale(.95)}
.big .i{width:28px;height:28px}
.br{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;margin-right:6px}
.vol{width:104px;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:linear-gradient(90deg,#fff var(--p,80%),#ffffff26 var(--p,80%));outline:0;cursor:pointer}
.vol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
.vol::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.sleepb{display:none;align-items:center;gap:4px;color:var(--a1);font-size:12px;font-weight:800;padding:0 8px;height:30px;border-radius:15px;background:color-mix(in srgb,var(--a1) 14%,transparent);cursor:pointer}
.sleepb.on{display:flex}
.mprog{display:none}

/* ---------- fullscreen player ---------- */
#fs{position:fixed;inset:0;z-index:60;display:none;background:var(--bg);overflow:hidden;touch-action:pan-y}
#fs.open{display:block;animation:fsin .42s cubic-bezier(.2,.8,.2,1)}
@keyframes fsin{from{opacity:0;transform:translateY(40px)}}
.fs-bg{position:absolute;inset:-120px;background-size:cover;background-position:center;filter:blur(90px) saturate(1.7) brightness(.7);transform:scale(1.2);transition:background-image .8s}
.fs-shade{position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 40%,transparent,#000b 80%),linear-gradient(180deg,#0005,#000a)}
.fs-head{position:absolute;top:calc(14px + var(--sat));left:20px;right:20px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px}
.fs-head .mid{text-align:center;font-size:12px;color:#ffffffb0;font-weight:700;letter-spacing:.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs-head .mid b{display:block;color:#fff;font-size:14px;letter-spacing:0;margin-top:2px}
.fs-btn{width:46px;height:46px;border-radius:50%;background:#ffffff1a;backdrop-filter:blur(10px);display:grid;place-items:center;flex:none}
.fs-btn:hover{background:#ffffff33}
.fs-in{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,480px);gap:64px;align-items:center;padding:80px 80px 150px;max-width:1500px;margin:0 auto}
#fsSlot{width:min(100%,62vh);aspect-ratio:1;border-radius:28px;overflow:hidden;margin-left:auto;box-shadow:0 40px 100px -30px #000;background:#0006;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.paused #fsSlot.lc{transform:scale(.92)}
#fsSlot img{width:100%;height:100%;object-fit:cover}
.fs-t{font-family:var(--display);font-size:46px;font-weight:800;letter-spacing:-1.8px;line-height:1.03}
.fs-a{font-size:20px;color:#ffffffb3;margin-top:8px;font-weight:600;cursor:pointer}
.fsprog{margin-top:34px}
.fsprog input{height:6px}
.fs-times{display:flex;justify-content:space-between;color:#ffffffa0;font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
.fs-ctl{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.fs-ctl .ib{width:52px;height:52px;color:#ffffffcc}
.fs-ctl .big{width:78px;height:78px}
.fs-ctl .big .i{width:36px;height:36px}
.fs-extra{display:flex;gap:6px;margin-top:22px;justify-content:center;flex-wrap:wrap}
.fs-next{margin-top:26px;background:#ffffff0f;border:1px solid #ffffff14;border-radius:18px;padding:14px;backdrop-filter:blur(10px)}
.fs-next h6{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#ffffff90;margin:0 0 8px 4px}
.fs-next .row{grid-template-columns:40px minmax(0,1fr);padding:6px}
.fs-next .row .th{width:40px;height:40px}
#viz{position:absolute;left:0;right:0;bottom:0;height:150px;width:100%;pointer-events:none;opacity:.75}

/* ---------- menus, modal & toast ---------- */
.ctx{position:fixed;z-index:110;min-width:230px;background:color-mix(in srgb,var(--card2) 92%,transparent);backdrop-filter:blur(20px);border:1px solid #ffffff1a;border-radius:16px;padding:6px;box-shadow:0 24px 60px -16px #000;animation:pop .14s}
.ctx .hd{display:flex;gap:10px;align-items:center;padding:8px 8px 10px;border-bottom:1px solid #ffffff10;margin-bottom:4px}
.ctx .hd .th{width:40px;height:40px;border-radius:8px;overflow:hidden;flex:none;background:var(--card)}
.ctx .hd .th img{width:100%;height:100%;object-fit:cover}
.ctx .hd .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.ctx .hd .a{font-size:12px;color:var(--muted)}
.ctx button,.ctx a{display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px;border-radius:10px;font-size:14px;font-weight:600;text-align:left;color:var(--text);text-decoration:none}
.ctx button:hover,.ctx a:hover{background:#ffffff14}
.ctx .i{color:var(--muted)}
.ctx .dng{color:#ff6b81}.ctx .dng .i{color:#ff6b81}
.sheetbg{position:fixed;inset:0;z-index:109;background:#0008;animation:fi .15s}
.mbg{position:fixed;inset:0;background:#000a;backdrop-filter:blur(8px);display:grid;place-items:center;z-index:100;animation:fi .15s;padding:16px}
.modal{width:min(460px,100%);max-height:90vh;overflow-y:auto;background:var(--card);border:1px solid #ffffff1a;border-radius:24px;padding:24px;box-shadow:0 30px 80px -20px #000;animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.modal h3{font-family:var(--display);font-size:22px;font-weight:800;margin-bottom:14px;letter-spacing:-.4px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal .opt{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:12px;text-align:left;font-weight:650}
.modal .opt:hover{background:var(--hover)}
.modal .opt .pc{width:44px;height:44px;border-radius:9px;display:grid;place-items:center;background:var(--card2);overflow:hidden}
.modal .opt .pc img{width:100%;height:100%;object-fit:cover}
.modal .optlist{max-height:320px;overflow-y:auto;margin:0 -6px}
.modal label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.covpick{display:flex;gap:14px;align-items:center}
.covpick .cv{width:96px;height:96px;border-radius:14px;overflow:hidden;background:var(--card2);flex:none;display:grid;place-items:center}
.covpick .cv img{width:100%;height:100%;object-fit:cover}
@keyframes fi{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}}
.toasts{position:fixed;left:50%;bottom:calc(var(--bar-h) + 18px);transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:120;pointer-events:none;align-items:center;width:max-content;max-width:92vw}
.toast{background:#f7f5fb;color:#111;padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:0 12px 30px -8px #000;animation:pop .22s;display:flex;align-items:center;gap:8px}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--grad);flex:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .app{grid-template-columns:var(--side-w) 1fr;grid-template-areas:"side top" "side main" "bar bar"}
  .panel{position:fixed;right:0;top:0;bottom:var(--bar-h);width:min(420px,100vw);z-index:65;transform:translateX(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;box-shadow:-30px 0 60px -20px #000}
  .panel.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
  .fs-in{grid-template-columns:1fr;gap:26px;padding:80px 40px 150px;align-content:center;max-width:620px}
  #fsSlot{margin:0 auto;width:min(100%,42vh)}
  .set-wrap{grid-template-columns:1fr}.set-nav{display:none}
}
@media (max-width:860px){
  :root{--side-w:78px}
  .brand .nm,.nav .lb,.plhead,.pls,.sep,.installb{display:none}
  .brand{justify-content:center;padding:4px 0 22px}
  .nav{justify-content:center;padding:12px}
  .srcpill{display:none}
  .bar{grid-template-columns:minmax(0,1fr) auto auto;padding:0 12px;gap:10px}
  .br .vol,.br .volb,.br .fsb{display:none}
  .row{grid-template-columns:48px minmax(0,1fr) auto}
  .row .n,.row .d{display:none}
  .vhead{flex-direction:column;align-items:flex-start}
  .vhead h1{font-size:38px}
  .fs-t{font-size:32px}
  .opt-row{flex-wrap:wrap}
  .two{grid-template-columns:1fr}
  .hero .hlogo{width:100px;height:100px}
}
/* ===== phone ===== */
@media (max-width:640px){
  :root{--card-min:146px;--top-h:62px}
  body{background:var(--bg)}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:calc(var(--top-h) + var(--sat)) minmax(0,1fr);grid-template-areas:"top" "main"}
  .side,.bar,.panel{grid-area:auto}
  .top{padding:var(--sat) 14px 0;gap:10px;min-width:0}
  .search{min-width:0}
  .mlogo{display:block}
  .avatar{width:36px;height:36px}
  .kbd{display:none}
  .main{padding:4px 16px calc(170px + var(--sab))}
  .chips.scroll{margin:0 -16px;padding:0 16px}
  /* bottom nav */
  .side{position:fixed;left:0;right:0;bottom:0;height:calc(62px + var(--sab));padding:6px 4px var(--sab);flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid #ffffff10;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);z-index:30}
  .brand,.nav.st,.nav.lib2{display:none}

async function api(path, params) {
  if (!S.key) throw new Error('NO_KEY');
  const u = new URL('https://www.googleapis.com/youtube/v3/' + path);
  u.search = new URLSearchParams({ ...params, key:S.key });
  const r = await fetch(u); const j = await r.json().catch(() => ({}));
  if (!r.ok) { const reason = j.error?.errors?.[0]?.reason;
    throw new Error(reason === 'quotaExceeded' || reason === 'dailyLimitExceeded' ? 'Se agotaron las búsquedas de hoy. Se reinician a las 3:00 a. m.' : (j.error?.message || ('Error ' + r.status))); }
  return j;
}
async function durations(ids) {
  const out = {};
  for (let i = 0; i < ids.length; i += 50) {
    try { const j = await api('videos', { part:'contentDetails', id:ids.slice(i, i + 50).join(',') }); (j.items || []).forEach(v => out[v.id] = iso(v.contentDetails.duration)); } catch {}
  }

}

async function ytSearch(q) {
  const c = S.cfg;
  const ck = `am:q:${c.region}:${c.lang}:${c.results}:${c.onlyMusic ? 1 : 0}:` + q.trim().toLowerCase();
  try { const x = JSON.parse(localStorage.getItem(ck)); if (x && Date.now() - x.t < 864e5) return x.v; } catch {}
  const params = { part:'snippet', type:'video', videoEmbeddable:'true', maxResults:String(c.results), q, regionCode:c.region };
  if (c.lang) params.relevanceLanguage = c.lang;
  if (c.onlyMusic) params.videoCategoryId = '10';
  const j = await api('search', params);
  const items = (j.items || []).filter(i => i.id?.videoId);
  const durs = await durations(items.map(i => i.id.videoId));
  const out = items.map(i => toTrack(i.id.videoId, i.snippet.title, i.snippet.channelTitle, durs[i.id.videoId]))
    .filter(t => !c.skipLong || !t.dur || t.dur < 1200);

  return out;
}

  let name = 'Playlist de YouTube';
  try { const p = await api('playlists', { part:'snippet', id:listId }); name = decode(p.items?.[0]?.snippet?.title || name); } catch {}
  const items = []; let token = '';
  for (let page = 0; page < 10; page++) {
    const j = await api('playlistItems', { part:'snippet', playlistId:listId, maxResults:'50', ...(token ? { pageToken:token } : {}) });

(() => {
  const fs = $('#fs'); let s = null;
  fs.addEventListener('touchstart', e => { if (!S.cfg.gestures || e.touches.length !== 1) return; const t = e.touches[0]; s = { x:t.clientX, y:t.clientY, onArt:!!e.target.closest('#fsSlot'), sc:$('#fsIn').scrollTop, tm:Date.now() }; }, { passive:true });
  fs.addEventListener('touchend', e => { if (!s) return; const t = e.changedTouches[0], dx = t.clientX - s.x, dy = t.clientY - s.y, fast = Date.now() - s.tm < 600;
    if (s.onArt && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && fast) { dx < 0 ? next() : prev(); }
    else if (dy > 110 && Math.abs(dy) > Math.abs(dx) * 1.5 && s.sc <= 0 && fast && !e.target.closest('input')) toggleFs(false);
    s = null; }, { passive:true });
  const bar = $('#bar'); let b = null;
  bar.addEventListener('touchstart', e => { if (!S.cfg.gestures) return; const t = e.touches[0]; b = { x:t.clientX, y:t.clientY }; }, { passive:true });
  bar.addEventListener('touchend', e => { if (!b) return; const t = e.changedTouches[0], dx = t.clientX - b.x, dy = t.clientY - b.y;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) dx < 0 ? next() : prev(); else if (dy < -50) toggleFs(true); b = null; }, { passive:true });
})();

function buildMixes() {
  const mixes = [];
  const topPlayed = Object.values(S.plays).filter(p => p.n > 0).sort((a, b) => b.n - a.n).map(p => p.t);
  const weekAgo = Date.now() - 7 * 864e5;
  const week = Object.values(S.plays).filter(p => p.last && p.last > weekAgo).sort((a, b) => b.n - a.n).map(p => p.t);
  if (S.favorites.length >= 3) mixes.push({ name:'Mix de favoritas', tag:'Para ti', list:shuffleArr(S.favorites.slice()) });
  if (topPlayed.length >= 3) mixes.push({ name:'En repetición', tag:'Tus más escuchadas', list:topPlayed.slice(0, 50) });
  if (week.length >= 3) mixes.push({ name:'Tu semana', tag:'Últimos 7 días', list:week.slice(0, 40) });
  if (local.length >= 3) mixes.push({ name:'Mi música al azar', tag:'Sin anuncios', list:shuffleArr(local.slice()).slice(0, 80) });
  if (S.history.length >= 12) mixes.push({ name:'Redescubre', tag:'Olvidadas', list:shuffleArr(S.history.slice(10)) });
  const neverLocal = local.filter(t => !S.plays[t.id]);
  if (neverLocal.length >= 3) mixes.push({ name:'Sin estrenar', tag:'Nunca escuchadas', list:shuffleArr(neverLocal).slice(0, 50) });
  return mixes;
}

let searchSeq = 0;
async function doSearch(q) {
  q = q.trim(); if (!q) { lastQuery = ''; go('search'); return; }
  const vid = ytIdFrom(q), list = ytListFrom(q);
  if ((vid || list) && !S.key) { toast('Configura tu clave de YouTube en Ajustes'); go('settings'); return; }
  if (list) { confirmBox('Importar playlist', 'Ese enlace es de una playlist de YouTube. ¿Importarla a AlanMusic? Gasta muy poca cuota (no usa búsquedas).', 'Importar', () => importYTPlaylist(list).catch(e => toast(e.message)), 'pri'); return; }
  if (vid) { try { const t = await ytVideo(vid); playList([t], 0, 'Enlace de YouTube'); $('#q').value = ''; } catch (e) { toast(e.message); } return; }
  lastQuery = q; view = 'search';
  S.recentQ = [q, ...S.recentQ.filter(r => r.toLowerCase() !== q.toLowerCase())].slice(0, 12); save();
  if (S.src === 'lc' || !S.key) { render(); return; }
  const seq = ++searchSeq; searching = true; searchErr = ''; render();
  try { const r = await ytSearch(q); if (seq !== searchSeq) return; searchResults = r; }
  catch (e) { if (seq !== searchSeq) return; searchErr = e.message; searchResults = []; }
  searching = false; if (view === 'search') render();
}

function vStats() {
  const entries = Object.values(S.plays).filter(p => p.n > 0 || p.s > 20);
  const plays = entries.reduce((s, p) => s + p.n, 0);
  const artists = {}; entries.forEach(e => { const a = e.t.artist || '—'; artists[a] = artists[a] || { n:0, s:0 }; artists[a].n += e.n; artists[a].s += e.s; });
  const topA = Object.entries(artists).sort((a, b) => b[1].s - a[1].s).slice(0, 8);
  const topT = entries.slice().sort((a, b) => b.n - a.n || b.s - a.s).slice(0, 15);
  const maxA = topA[0]?.[1].s || 1;
  const days = Array.from({ length:14 }, (_, i) => { const d = new Date(Date.now() - (13 - i) * 864e5); return { k:today(d), l:d.toLocaleDateString('es-CO', { weekday:'short' }).slice(0, 2), v:(S.daily[today(d)] || 0) / 60 }; });
  const maxD = Math.max(1, ...days.map(d => d.v));
  const maxH = Math.max(1, ...S.hours); const peak = S.hours.indexOf(Math.max(...S.hours));
  const streak = (() => { let n = 0; for (let i = 0; i < 400; i++) { const k = today(new Date(Date.now() - i * 864e5)); if ((S.daily[k] || 0) > 60) n++; else if (i > 0) break; } return n; })();
  let h = `<div class="vhead"><div class="cover">${logo()}</div><div><div class="kind">Tu resumen</div><h1>${esc(S.cfg.name || 'Tu')} en AlanMusic</h1><div class="meta">Todo lo que has escuchado desde que empezaste</div></div></div>

      <div class="stat"><div class="v">${plays.toLocaleString('es-CO')}</div><div class="k">reproducciones</div></div>
      <div class="stat"><div class="v">${entries.length.toLocaleString('es-CO')}</div><div class="k">canciones distintas</div></div>
      <div class="stat"><div class="v">${Object.keys(artists).length}</div><div class="k">artistas</div></div>
      <div class="stat"><div class="v">${streak}🔥</div><div class="k">días seguidos escuchando</div></div>
    </div>`;
  if (!entries.length) return h + `<div class="empty" style="margin-top:20px">${ic('chart')}<h3>Aún no hay datos</h3><p>Escucha música y aquí verás tus artistas, canciones y hábitos.</p></div>`;
  h += `<div class="two" style="margin-top:30px"><div><div class="sec-h" style="margin-top:0"><div><div class="sub">Minutos por día</div><h2>Últimos 14 días</h2></div></div>
      <div class="chart">${days.map((d, i) => `<div class="c" title="${Math.round(d.v)} min"><div class="b ${d.v < .5 ? 'z' : ''}" style="height:${Math.max(2, d.v / maxD * 100)}%;animation-delay:${i * 30}ms"></div><div class="l">${d.l}</div></div>`).join('')}</div></div>
    <div><div class="sec-h" style="margin-top:0"><div><div class="sub">Tu hora favorita: ${peak}:00</div><h2>Cuándo escuchas</h2></div></div>
      <div class="chart" style="gap:3px">${S.hours.map((v, i) => `<div class="c" title="${i}:00 · ${Math.round(v / 60)} min"><div class="b ${v < 30 ? 'z' : ''}" style="height:${Math.max(2, v / maxH * 100)}%;animation-delay:${i * 20}ms"></div><div class="l">${i % 6 === 0 ? i + 'h' : ''}</div></div>`).join('')}</div></div></div>
    <div class="sec-h"><div><div class="sub">Por tiempo escuchado</div><h2>Tus artistas top</h2></div></div>

/* =================== local import =================== */
function readTags(f) { return new Promise(res => {
  if (!window.jsmediatags) return res({});
  try { jsmediatags.read(f, { onSuccess:({ tags }) => { let art = null;
      if (tags.picture?.data) { try { art = new Blob([new Uint8Array(tags.picture.data)], { type:tags.picture.format || 'image/jpeg' }); } catch {} }
      res({ title:tags.title, artist:tags.artist, album:tags.album, art }); }, onError:() => res({}) }); }
  catch { res({}); }
}); }
function readDur(f) { return new Promise(res => {
  let done = false; const a = new Audio(); const u = URL.createObjectURL(f);
  const fin = d => { if (done) return; done = true; URL.revokeObjectURL(u); a.removeAttribute('src'); res(d); };
  a.preload = 'metadata'; a.onloadedmetadata = () => fin(isFinite(a.duration) ? a.duration : 0); a.onerror = () => fin(0);
  setTimeout(() => fin(0), 8000); a.src = u;
}); }
function parseName(name) {
  const base = name.replace(/\.[^.]+$/, '').replace(/^\d{1,3}[\s._-]+/, '').replace(/_/g, ' ').trim();
  const m = base.match(/^(.+?)\s+-\s+(.+)$/); return m ? { artist:m[1].trim(), title:m[2].trim() } : { title:base };
}
async function importFiles(files) {
  const list = [...files].filter(f => f.type.startsWith('audio/') || /\.(mp3|m4a|aac|flac|wav|ogg|opus|weba)$/i.test(f.name));
  if (!list.length) return toast('No se encontraron archivos de audio');
  const existing = new Set(local.map(t => t.title + '|' + t.artist + '|' + Math.round(t.dur)));
  toast(`Importando ${list.length} canciones…`);
  let n = 0, dup = 0;
  for (const f of list) {
    const [tags, dur] = await Promise.all([readTags(f), readDur(f)]); const pn = parseName(f.name);
    const rec = { id:'lc:' + uid(), title:(tags.title || pn.title).trim(), artist:(tags.artist || pn.artist || 'Artista desconocido').trim(), album:tags.album || '', dur, blob:f, art:tags.art || null, addedAt:Date.now() + n };
    const sig = rec.title + '|' + rec.artist + '|' + Math.round(dur);
    if (existing.has(sig)) { dup++; continue; } existing.add(sig);
    try { await DB.put(rec); } catch { localBlobs.set(rec.id, f); }
    addLocal(rec); n++;
    if (n % 10 === 0 && view === 'library') render();
  }
  toast(`${n} canciones añadidas${dup ? ` · ${dup} duplicadas omitidas` : ''}`);
  render();
}
function bindDrop() {
  const d = $('#drop');
  if (d) { d.ondragover = e => { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = () => d.classList.remove('over');
    d.ondrop = e => { e.preventDefault(); d.classList.remove('over'); importFiles(e.dataTransfer.files); }; }
  const s = $('#libSort'); if (s) s.onchange = () => { S.libSort = s.value; save(); render(); };

    case 'playall': { const k = el.dataset.list; playList(LISTS[k] || [], 0, LIST_LABELS[k]); break; }
    case 'playmix': { const l = LISTS[el.dataset.list] || []; playList(l, 0, el.dataset.name); break; }
    case 'shuffleall': { const k = el.dataset.list, l = LISTS[k] || []; if (!l.length) break; if (!S.shuffle) { S.shuffle = true; save(); updateBarState(); } playList(l, Math.floor(Math.random() * l.length), LIST_LABELS[k]); break; }
    case 'resume': playList(S.history, 0, 'Escuchado recientemente'); break;
    case 'like': toggleLike(el.dataset.id); renderBarInfo(); break;
    case 'more': { const r = el.getBoundingClientRect(); trackMenu(el.dataset.id, r.left - 200, r.bottom + 4, el.closest('.row')); break; }
    case 'addpl': addToPlaylistUI(el.dataset.id); break;
    case 'queue': addToQueue(findTrack(el.dataset.id)); break;
    case 'cplaynext': addToQueue(findTrack(el.dataset.id), true); break;
    case 'copylink': try { await navigator.clipboard.writeText('https://youtu.be/' + el.dataset.id); toast('Enlace copiado'); } catch { toast('No se pudo copiar'); } break;
    case 'artist': go('artist:' + encodeURIComponent(el.dataset.name)); break;
    case 'ytartist': S.src = 'yt'; syncSrc(); $('#q').value = el.dataset.name; doSearch(el.dataset.name); break;
    case 'setsrc': S.src = el.dataset.v; save(); syncSrc(); if (lastQuery) doSearch(lastQuery); else render(); break;
    case 'jump': qi = +el.dataset.i; load(queue[qi]); break;
    case 'unq': queue.splice(+el.dataset.i, 1); renderPanel(); renderFs(); break;
    case 'clearq': queue = queue.slice(0, qi + 1); renderPanel(); renderFs(); break;
    case 'chip': loadChip(+el.dataset.i); break;
    case 'searchchip': $('#q').value = CHIPS[+el.dataset.i][0]; S.src = 'yt'; syncSrc(); doSearch(CHIPS[+el.dataset.i][1]); break;
    case 'rq': { const q = S.recentQ[+el.dataset.i]; $('#q').value = q; doSearch(q); break; }
    case 'rqx': S.recentQ.splice(+el.dataset.i, 1); save(); render(); break;
    case 'libtab': S.libTab = el.dataset.v; save(); render(); break;
    case 'newpl': editPlaylist(null); break;
    case 'editpl': editPlaylist(S.playlists.find(x => x.id === el.dataset.pl)); break;
    case 'plmenu': { const r = el.getBoundingClientRect(); plMenu(S.playlists.find(x => x.id === el.dataset.pl), r.left, r.bottom + 6); break; }
    case 'plqueue': { const p = S.playlists.find(x => x.id === el.dataset.pl); p.tracks.forEach(t => { const r = resolve(t); if (r) queue.push(r); }); if (!cur) playList(p.tracks, 0, p.name); else { renderPanel(); toast('Añadidas a la cola'); } break; }
    case 'duppl': { const p = S.playlists.find(x => x.id === el.dataset.pl); const np = { ...p, id:uid(), name:p.name + ' (copia)', tracks:p.tracks.slice(), yt:null, created:Date.now() }; S.playlists.push(np); save(); go('pl:' + np.id); toast('Playlist duplicada'); break; }
    case 'sortpl': { const p = S.playlists.find(x => x.id === el.dataset.pl), k = el.dataset.v; p.tracks.sort((x, y) => (x[k] || '').localeCompare(y[k] || '')); save(); render(); toast('Playlist ordenada'); break; }
    case 'copypl': { const p = S.playlists.find(x => x.id === el.dataset.pl); const txt = p.name + '\n\n' + p.tracks.map((t, i) => `${i + 1}. ${t.artist} - ${t.title}${t.ytId ? '  https://youtu.be/' + t.ytId : ''}`).join('\n');
      try { await navigator.clipboard.writeText(txt); toast('Lista copiada'); } catch { toast('No se pudo copiar'); } break; }
    case 'delpl': { const p = S.playlists.find(x => x.id === el.dataset.pl);
      confirmBox('Eliminar playlist', `¿Eliminar «${esc(p.name)}»? Las canciones no se borran.`, 'Eliminar', () => { S.playlists = S.playlists.filter(x => x !== p); save(); go('library'); toast('Playlist eliminada'); }); break; }
    case 'rmpl': { const p = S.playlists.find(x => x.id === el.dataset.pl); p.tracks.splice(+el.dataset.i, 1); save(); render(); toast('Quitada de la playlist'); break; }
    case 'dellocal': { const t = local.find(x => x.id === el.dataset.id);
      confirmBox('Eliminar de la biblioteca', `¿Eliminar «${esc(t.title)}»? También se quitará de tus playlists.`, 'Eliminar', async () => {
        try { await DB.del(t.id); } catch {} localBlobs.delete(t.id);
        local.splice(local.indexOf(t), 1); const u = artURL.get(t.id); if (u) URL.revokeObjectURL(u); artURL.delete(t.id);
        S.favorites = S.favorites.filter(f => f.id !== t.id); S.history = S.history.filter(f => f.id !== t.id); delete S.plays[t.id];
        S.playlists.forEach(p => p.tracks = p.tracks.filter(x => x.id !== t.id)); save(); render(); toast('Canción eliminada'); }); break; }
    case 'pickfiles': $('#fileIn').click(); break;
    case 'pickdir': $('#dirIn').click(); break;
    case 'openfs': if (isPhone() || window.innerWidth > 1180) toggleFs(true); else openPanel(!panelOpen); break;
    case 'closepanel': if (window.innerWidth > 1180) togglePanel(); else openPanel(false); break;
    case 'fs': toggleFs(); break;
    case 'fsqueue': toggleFs(false); setTimeout(() => window.innerWidth > 1180 ? (S.panelHidden && togglePanel()) : openPanel(true), 60); break;
    case 'fsmenu': { if (!cur) break; const r = el.getBoundingClientRect(); trackMenu(cur.id, r.left - 200, r.bottom + 6); break; }
    case 'sleepmenu': { const r = el.getBoundingClientRect(); sleepMenu(r.left, r.top - 300); break; }
    case 'toggle': togglePlay(); break;
    case 'next': next(); break;
    case 'prev': prev(); break;
    case 'shuf': $('#bShuffle').click(); renderFsCtl(); break;
    case 'rep': $('#bRepeat').click(); renderFsCtl(); break;
    case 'install': if (deferredInstall) { deferredInstall.prompt(); const r = await deferredInstall.userChoice; if (r.outcome === 'accepted') deferredInstall = null; } break;
    case 'cfgtog': { const k = el.dataset.k; S.cfg[k] = !S.cfg[k]; save(); applyCfg(k); render(); break; }
    case 'cfgset': { const k = el.dataset.k; S.cfg[k] = NUMK.has(k) ? +el.dataset.v : el.dataset.v; save(); applyCfg(k); render(); break; }
    case 'eqpreset': S.cfg.eqPreset = el.dataset.v; S.cfg.eq = EQ_PRESETS[el.dataset.v][1].slice(); save(); applyEQ(); render(); break;
    case 'sleep': setSleep(el.dataset.v); if (fsOpen) renderFs(); break;
    case 'setjump': e.preventDefault(); $('#s-' + el.dataset.id)?.scrollIntoView({ behavior:'smooth', block:'start' }); break;
    case 'importpl': { const v = $('#plIn').value.trim(); const id = ytListFrom(v) || (/^[\w-]{12,}$/.test(v) ? v : null);
      if (!id) { toast('Pega un enlace que contenga «list=»'); break; } if (!S.key) { toast('Primero guarda tu clave de YouTube'); break; }
      importYTPlaylist(id).catch(err => toast(err.message)); break; }
    case 'savekey': {
      const k = $('#keyIn').value.trim(); const msg = $('#keyMsg');
      if (!k) { S.key = ''; save(); msg.textContent = 'Clave eliminada.'; break; }
      msg.innerHTML = `<span style="color:var(--muted)">Probando…</span>`;
      try {
        const r = await fetch(`https://www.googleapis.com/youtube/v3/videoCategories?part=snippet&regionCode=CO&key=${encodeURIComponent(k)}`);
        const j = await r.json(); if (!r.ok) throw new Error(j.error?.message || 'Error ' + r.status);
        S.key = k; save(); msg.innerHTML = `<span style="color:#5de3a0">✓ Clave válida. Ya puedes buscar en YouTube.</span>`; homeResults = []; loadChip(S.chip || 0);
      } catch (err) { msg.innerHTML = `<span style="color:#ff6b81">✗ ${esc(err.message)}</span>`; }
      break; }
    case 'showkey': { const i = $('#keyIn'); i.type = i.type === 'password' ? 'text' : 'password'; break; }
    case 'export': exportData(); break;
    case 'import': $('#bakIn').click(); break;
    case 'clearhist': S.history = []; save(); toast('Historial borrado'); break;
    case 'clearstats': confirmBox('Borrar estadísticas', 'Se reiniciarán tus minutos, reproducciones, gráficas y tops.', 'Borrar', () => { S.plays = {}; S.listened = 0; S.daily = {}; S.hours = Array(24).fill(0); save(); toast('Estadísticas borradas'); }); break;
    case 'clearcache': Object.keys(localStorage).filter(k => k.startsWith('am:q:')).forEach(k => localStorage.removeItem(k)); toast('Caché borrada'); break;
    case 'resetall': confirmBox('Restablecer todo', 'Se borrarán favoritas, playlists, historial, estadísticas, clave y toda tu música importada. No se puede deshacer.', 'Restablecer', async () => {
      try { localStorage.clear(); } catch {} try { DB.db?.close(); indexedDB.deleteDatabase('alanmusic'); } catch {} location.reload(); }); break;
  }
});

$('#bPlay').onclick = togglePlay;
$('#bNext').onclick = () => next();
$('#bPrev').onclick = prev;
$('#bShuffle').onclick = () => { S.shuffle = !S.shuffle; save(); updateBarState(); buzz();
  if (S.shuffle && queue.length > qi + 1) { const rest = shuffleArr(queue.slice(qi + 1)); queue = [...queue.slice(0, qi + 1), ...rest]; renderPanel(); renderFs(); }
  toast(S.shuffle ? 'Aleatorio activado' : 'Aleatorio desactivado'); };
$('#bRepeat').onclick = () => { S.repeat = { off:'all', all:'one', one:'off' }[S.repeat]; save(); updateBarState(); buzz(); toast($('#bRepeat').title); };
$('#bMute').onclick = () => { S.muted = !S.muted; if (!S.muted && S.volume === 0) S.volume = 50; save(); applyVolume(); };
$('#bQueue').onclick = togglePanel;
$('#vol').oninput = e => setVolume(+e.target.value);
const seek = $('#seek');
seek.addEventListener('input', () => { seeking = true; const d = curDur(); seek.style.setProperty('--p', seek.value / 10 + '%'); $('#time').textContent = `${fmt(d * seek.value / 1000)} / ${fmt(d)}`; });
seek.addEventListener('change', () => { seekTo(curDur() * seek.value / 1000); seeking = false; });

const qIn = $('#q'); let qT;
qIn.addEventListener('input', () => { clearTimeout(qT); if (S.src === 'lc') qT = setTimeout(() => doSearch(qIn.value), 150); });
qIn.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(qT); doSearch(qIn.value); qIn.blur(); } if (e.key === 'Escape') qIn.blur(); });
qIn.addEventListener('paste', () => setTimeout(() => { if (ytIdFrom(qIn.value) || ytListFrom(qIn.value)) doSearch(qIn.value); }, 0));
qIn.addEventListener('focus', () => { if (isPhone() && view !== 'search') go('search'); });
function syncSrc() { $$('#srcpill button').forEach(b => b.classList.toggle('on', b.dataset.src === S.src)); qIn.placeholder = S.src === 'yt' ? (isPhone() ? '¿Qué quieres escuchar?' : 'Busca canciones, artistas o pega un enlace de YouTube') : 'Busca en tu música'; }
$('#srcpill').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.src = b.dataset.src; save(); syncSrc(); if (qIn.value.trim()) doSearch(qIn.value); };

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (ctxEl) { closeCtx(); return; } if ($('.mbg')) { $('.mbg').remove(); return; } if (fsOpen) { toggleFs(false); return; } if (panelOpen) { openPanel(false); return; } }
  if (e.target.matches('input,textarea,select') || e.ctrlKey || e.metaKey || e.altKey || $('.mbg')) return;
  const k = e.key, kl = k.toLowerCase();
  if (k === ' ') { e.preventDefault(); togglePlay(); }
  else if (k === '/') { e.preventDefault(); if (fsOpen) toggleFs(false); qIn.focus(); qIn.select(); }
  else if (k === 'ArrowRight') { e.preventDefault(); e.shiftKey ? next() : seekTo(Math.min(curDur(), curTime() + 10)); }
  else if (k === 'ArrowLeft') { e.preventDefault(); e.shiftKey ? prev() : seekTo(Math.max(0, curTime() - 10)); }
  else if (k === 'ArrowUp') { e.preventDefault(); setVolume(S.volume + 5); }
  else if (k === 'ArrowDown') { e.preventDefault(); setVolume(S.volume - 5); }
  else if (kl === 'm') $('#bMute').click();
  else if (kl === 'l' && cur) { toggleLike(cur.id); renderBarInfo(); }
  else if (kl === 's') { $('#bShuffle').click(); renderFsCtl(); }
  else if (kl === 'r') { $('#bRepeat').click(); renderFsCtl(); }
  else if (kl === 'f') toggleFs();
  else if (kl === 'q') togglePanel();
});

/* =================== boot =================== */
(async () => {
  $('#splashLogo').innerHTML = logo(); $('#brandLogo').innerHTML = logo(); $('#mLogo').innerHTML = logo();
  $('#sIco').innerHTML = ic('explore', 's');
  $('#closePanel').innerHTML = ic('close','s'); $('#pFs').innerHTML = ic('expand','s'); $('#fsClose').innerHTML = ic('down'); $('#fsMore').innerHTML = ic('more');
  $('#bPrev').innerHTML = ic('prev'); $('#bNext').innerHTML = ic('next'); $('#bQueue').innerHTML = ic('panel', 's'); $('#bFs').innerHTML = ic('expand', 's');
  $('#app').classList.toggle('nopanel', S.panelHidden);
  applyTheme(); syncSrc(); updateBarState(); applyVolume(); renderBarInfo(); renderPanel();
  view = S.cfg.startView || 'home'; render();
  try { await DB.open(); const rows = await DB.all(); rows.sort((a, b) => a.addedAt - b.addedAt).forEach(addLocal); }
  catch { toast('Este navegador no permite guardar tu música entre sesiones'); }
  // recuperar sesión
  if (S.cfg.resume && S.session?.queue?.length) {
    queue = S.session.queue.map(resolve).filter(Boolean); qi = clamp(S.session.qi, 0, queue.length - 1); fromLabel = S.session.from || '';
    if (queue[qi]) load(queue[qi], { auto:false, start:S.session.t || 0 });
  }
  render();
  if (S.key && !S.cfg.dataSaver) loadChip(S.chip || 0);
  setTimeout(() => $('#splash').classList.add('hide'), S.cfg.motion ? 900 : 100);
})();
</script>
</body>
